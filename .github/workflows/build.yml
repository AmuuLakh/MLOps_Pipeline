name: Build Docker

on:
  workflow_run:
    workflows: ["Model Evaluation"]
    types: [completed]

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build Docker image
      run: docker build -t sentiment-app:latest .
    
    - name: Tag for DockerHub
      run: |
        docker tag sentiment-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-app:latest
        docker tag sentiment-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-app:${{ github.sha }}
    
    - name: Push to DockerHub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-app:${{ github.sha }}
    
    - name: Success message
      run: |
        echo "Docker image pushed to DockerHub!"
        echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/sentiment-app"
        echo "Tags: latest, ${{ github.sha }}"